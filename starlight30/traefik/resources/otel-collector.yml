apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-traces
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
    processors:
      transform/url:
        error_mode: ignore
        trace_statements:
          - context: span
            statements:
              - set(attributes["http.route"], Concat([attributes["server.address"], attributes["url.path"]], "")) where span.kind == SPAN_KIND_SERVER and attributes["http.route"] == nil and attributes["server.address"] != nil and attributes["url.path"] != nil
              - set(attributes["http.url"], Concat([attributes["url.scheme"], "://", attributes["server.address"], attributes["url.path"]], "")) where span.kind == SPAN_KIND_SERVER and attributes["http.url"] == nil and IsMatch(attributes["url.scheme"], "^https?$") and attributes["server.address"] != nil and attributes["url.path"] != nil
              - set(attributes["url.full"], attributes["http.url"]) where span.kind == SPAN_KIND_SERVER and attributes["url.full"] == nil and attributes["http.url"] != nil
              - set(attributes["http.client_ip"], attributes["client.address"]) where span.kind == SPAN_KIND_SERVER and attributes["http.client_ip"] == nil and attributes["client.address"] != nil
              - delete_key(attributes, "url.query") where span.kind == SPAN_KIND_SERVER and IsMatch(attributes["url.query"], "REDACTED")
      batch:
        timeout: 5s
    exporters:
      otlp:
        endpoint: dd.datadog.svc.cluster.local:4317
        tls:
          insecure: true
    extensions:
      health_check:
        endpoint: 0.0.0.0:13133
    service:
      extensions: [health_check]
      telemetry:
        logs:
          level: warn
      pipelines:
        traces:
          receivers: [otlp]
          processors: [transform/url, batch]
          exporters: [otlp]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-traces
  labels:
    app: otel-traces
spec:
  replicas: 1
  selector:
    matchLabels:
      app: otel-traces
  template:
    metadata:
      labels:
        app: otel-traces
    spec:
      containers:
        - name: otel-traces
          image: otel/opentelemetry-collector-contrib:0.162.0@sha256:39923a8e431bd1f57be82411999d389fcfe40857492e4365456d97a4c1f74be6
          args: ["--config=/conf/config.yaml"]
          ports:
            - name: otlp-grpc
              containerPort: 4317
              protocol: TCP
            - name: health
              containerPort: 13133
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /
              port: health
          livenessProbe:
            httpGet:
              path: /
              port: health
          volumeMounts:
            - name: config
              mountPath: /conf
      volumes:
        - name: config
          configMap:
            name: otel-traces
---
apiVersion: v1
kind: Service
metadata:
  name: otel-traces
spec:
  selector:
    app: otel-traces
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: otlp-grpc
      protocol: TCP
