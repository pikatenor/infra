defaultNamespace: traefik

helm:
  repo: https://traefik.github.io/charts
  chart: traefik
  version: 41.7.1
  values:
    deployment:
      kind: DaemonSet
    service:
      spec:
        type: NodePort
        externalTrafficPolicy: Local
    ports:
      web:
        nodePort: 80
      websecure:
        nodePort: 443
    ingressRoute:
      dashboard:
        enabled: true
    tlsStore:
      default:
        defaultCertificate:
          secretName: wild-cert
    tracing:
      otlp:
        enabled: true
        grpc:
          enabled: true
          insecure: true
          endpoint: "otel-traces.traefik.svc.cluster.local:4317"
    providers:
      kubernetesCRD:
        allowCrossNamespace: true

dependsOn:
  - selector:
      matchLabels:
        app: cert-manager
