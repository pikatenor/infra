---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: chopin-state
  namespace: chopin
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: chopin-db
  namespace: chopin
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
