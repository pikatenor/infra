---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: tnl-cert
  labels:
    use-cloudflare-solver: "true"
spec:
  secretName: tnl-cert
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt-production
  commonName: tnl.app.p1kachu.net
  dnsNames:
    - tnl.app.p1kachu.net
    - '*.tnl.app.p1kachu.net'
